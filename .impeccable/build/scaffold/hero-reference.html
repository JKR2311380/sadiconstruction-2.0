<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: landing-c.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barriecito:wght@400&family=Diplomata:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#ccaa77}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <figure class="r-room region plate" data-region="room"><img src="../../../assets/plates/room.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-wire region plate" data-region="wire"><img src="../../../assets/plates/wire.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-clip-1 region plate" data-region="clip-1"><img src="../../../assets/plates/clip-1.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-clip-2 region plate" data-region="clip-2"><img src="../../../assets/plates/clip-2.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-clip-3 region plate" data-region="clip-3"><img src="../../../assets/plates/clip-3.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-clip-4 region plate" data-region="clip-4"><img src="../../../assets/plates/clip-4.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-sheet region plate" data-region="sheet"><img src="../../../assets/plates/sheet.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-diazo-grain region texture" data-region="diazo-grain" style="background-image:url('../../../assets/plates/diazo-grain.png');background-repeat:repeat"></div>
  <div class="r-title-left region text" data-region="title-left"><!-- CLEARWATER MEDICAL CENTER / PRJ-2024-008 / TRANSlucent DIAZO PROGRAMME / ISSUED FOR REVIEW. --><p style="font-size:var(--r-title-left-font);font-family:var(--r-title-left-family),sans-serif;font-weight:var(--r-title-left-weight);line-height:1.05;margin:0">title-left</p></div>
  <div class="r-location-left region text" data-region="location-left"><!-- LOCATION block with site address. --><p style="line-height:1.05;margin:0">location-left</p></div>
  <div class="r-phase-2-band region text" data-region="phase-2-band"><!-- PHASE 2 kraft band with WORKING DAYS and FLOAT. --><p style="font-size:var(--r-phase-2-band-font);font-family:var(--r-phase-2-band-family),sans-serif;font-weight:var(--r-phase-2-band-weight);line-height:1.05;margin:0">phase-2-band</p></div>
  <div class="r-longest-path-kicker region text" data-region="longest-path-kicker"><!-- LONGEST PATH (CRITICAL) column header. --><p style="line-height:1.05;margin:0">longest-path-kicker</p></div>
  <div class="r-week-scale-left region text" data-region="week-scale-left"><!-- W22–W20 week-scale numerals above the left Gantt. --><p style="line-height:1.05;margin:0">week-scale-left</p></div>
  <div class="r-activity-ids-left region text" data-region="activity-ids-left"><!-- Numbered Longest Path activity names, 1.1 through 3.6. --><p style="line-height:1.05;margin:0">activity-ids-left</p></div>
  <div class="r-near-critical region text" data-region="near-critical"><!-- NEAR CRITICAL and NON-CRITICAL / FLOAT legend labels. --><p style="line-height:1.05;margin:0">near-critical</p></div>
  <div class="r-programme-notes region text" data-region="programme-notes"><!-- PROGRAMME NOTES footer copy about Longest Path and float. --><p style="font-size:var(--r-programme-notes-font);line-height:1.05;margin:0">programme-notes</p></div>
  <div class="r-print-meta-left region text" data-region="print-meta-left"><!-- DIAZO PRINT No. and SCALE on the left sheet foot. --><p style="font-size:var(--r-print-meta-left-font);line-height:1.05;margin:0">print-meta-left</p></div>
  <div class="r-wordmark region text" data-region="wordmark"><!-- SADICONSTRUCTION wordmark, condensed black caps. --><p style="line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-title-right region text" data-region="title-right"><!-- CLEARWATER MEDICAL CENTER / PRJ-2024-008 / ENCLOSURE PROGRAMME. --><p style="font-size:var(--r-title-right-font);line-height:1.05;margin:0">title-right</p></div>
  <div class="r-sign-in region control" data-region="sign-in"><!-- SIGN IN text control at the top-right of the sheet.: rebuild the control's chrome from the crop (comp-spec.mjs --crop sign-in); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-location-right region text" data-region="location-right"><!-- LOCATION block on the right programme. --><p style="font-size:var(--r-location-right-font);line-height:1.05;margin:0">location-right</p></div>
  <div class="r-phase-3-band region text" data-region="phase-3-band"><!-- PHASE 3 kraft band with WORKING DAYS and FLOAT. --><p style="line-height:1.05;margin:0">phase-3-band</p></div>
  <div class="r-activity-kicker-right region text" data-region="activity-kicker-right"><!-- ACTIVITY ID: header. --><p style="font-size:var(--r-activity-kicker-right-font);line-height:1.05;margin:0">activity-kicker-right</p></div>
  <div class="r-week-scale-right region text" data-region="week-scale-right"><!-- Week-scale numerals above the right Gantt. --><p style="line-height:1.05;margin:0">week-scale-right</p></div>
  <div class="r-activity-ids-right region text" data-region="activity-ids-right"><!-- Numbered enclosure activities 1.1 through 2.5. --><p style="font-size:var(--r-activity-ids-right-font);line-height:1.05;margin:0">activity-ids-right</p></div>
  <div class="r-print-meta-right region text" data-region="print-meta-right"><!-- DIAZO PRINT No. and SCALE on the right sheet foot. --><p style="line-height:1.05;margin:0">print-meta-right</p></div>
  <div class="r-request-access region control" data-region="request-access"><!-- Vermilion REQUEST ACCESS issue-stamp, the primary action.: rebuild the control's chrome from the crop (comp-spec.mjs --crop request-access); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
